buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Android Lint interprets "!" in a generated JAR path as an archive separator.
// Keep generated artifacts in a sibling directory whose absolute path has no "!".
def sharedBuildRoot = new File(rootDir.parentFile, 'Think-build')
layout.buildDirectory.set(new File(sharedBuildRoot, 'root'))
subprojects {
    layout.buildDirectory.set(new File(sharedBuildRoot, project.name))
}
