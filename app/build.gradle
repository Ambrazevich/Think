plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devops.numix'
    compileSdk 34

    defaultConfig {
        applicationId "com.devops.numix"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // This line is CRUCIAL for MaterialButton and other Material Design components
    implementation 'com.google.android.material:material:1.11.0' // Or latest stable version
    // This line is CRUCIAL for ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Or latest stable version

    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
